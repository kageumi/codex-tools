name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            script: dist:win
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            script: dist:mac:arm64
            verify_script: verify:mac:arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run ${{ matrix.script }}
      - name: Verify macOS bundle signature
        if: matrix.platform == 'macos'
        run: bun run ${{ matrix.verify_script }}
